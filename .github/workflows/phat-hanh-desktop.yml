# P3B-14.3: tạo tag v* (ví dụ v0.2.0) thì build bộ cài NSIS trên máy Windows của GitHub
# và đính tệp .exe vào GitHub Releases của tag đó. Không chạy ở các lần push thường.
# D-37 (P3B-29): bộ cài được ký bằng khóa trong Secret `TAURI_SIGNING_PRIVATE_KEY` và sinh thêm `latest.json`
# để app Desktop tự báo bản mới. Chỉ cần đẩy tag; GitHub tự đặt bản mới là Latest (trừ khi tạo tay kiểu pre-release).
name: Phát hành bộ cài Desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  nsis:
    name: Build bộ cài NSIS và đăng lên Releases
    runs-on: windows-latest
    env:
      # Địa chỉ API công khai của bản phát hành (không phải bí mật, cùng giá trị trong .env.example)
      VITE_API_URL: https://api-forgestore.tranquyet.id.vn/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Chặn phát hành lệch số: bản cập nhật so sánh theo số phiên bản trong tauri.conf.json, nên bốn chỗ phải trùng với tag
      - name: Kiểm số phiên bản khớp với tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          if ($tag -ne $conf -or $tag -ne $pkg -or $tag -ne $cargo) {
            Write-Error "Số phiên bản không khớp với tag v$tag. Sửa tauri.conf.json, package.json, Cargo.toml rồi tạo lại tag."
            exit 1
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (desktop)
        run: pnpm install --frozen-lockfile --filter "@forgestore/desktop..."

      - name: Build shared packages (types, ui-tokens)
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # tauri build tự chạy beforeBuildCommand (vite build) rồi đóng gói NSIS theo tauri.conf.json
      - name: Build bộ cài NSIS (ký bản cập nhật)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @forgestore/desktop tauri build --bundles nsis

      # latest.json là tệp app đọc để biết có bản mới; chữ ký lấy từ tệp .sig do bước build sinh ra
      - name: Tạo latest.json cho bộ cập nhật
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $phienBan = $tag.TrimStart('v')
          $thuMuc = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem "$thuMuc/*.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$thuMuc/*.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) { Write-Error 'Thiếu bộ cài hoặc tệp chữ ký (.sig). Kiểm Secret TAURI_SIGNING_PRIVATE_KEY.'; exit 1 }
          $noiDung = [ordered]@{
            version  = $phienBan
            notes    = "Bản cập nhật ForgeStore $phienBan"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
              }
            }
          }
          $noiDung | ConvertTo-Json -Depth 5 | Set-Content -Path "$thuMuc/latest.json" -Encoding utf8NoBOM
          Get-Content "$thuMuc/latest.json"

      # Bản tên cố định để Landing dùng đường dẫn tải trực tiếp .../releases/latest/download/ForgeStore-Setup.exe,
      # không phải sửa trang mỗi lần đổi số phiên bản. Bản có số phiên bản vẫn giữ nguyên cho bộ cập nhật (latest.json).
      - name: Tạo bản bộ cài tên cố định
        shell: pwsh
        run: |
          $thuMuc = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem "$thuMuc/ForgeStore_*_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error 'Không thấy bộ cài có số phiên bản.'; exit 1 }
          Copy-Item $exe.FullName "$thuMuc/ForgeStore-Setup.exe"

      - name: Đăng bộ cài lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: true
