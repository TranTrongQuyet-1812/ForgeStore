name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @forgestore/backend run prisma:generate

      - name: Check code formatting

        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Build backend
        run: pnpm build:backend

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify migrations do not drop HNSW index
        run: |
          if grep -rni "DROP INDEX.*idx_phan_tich_ai_vector" apps/backend/prisma/migrations/; then
            echo "❌ Error: Migration contains DROP INDEX idx_phan_tich_ai_vector!"
            exit 1
          else
            echo "✅ Verified: No migration drops idx_phan_tich_ai_vector."
          fi

