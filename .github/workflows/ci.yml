name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Repo private: phút Actions có hạn (runner Windows tính x2), nên job nặng chỉ chạy khi đụng đúng phần code.
  changes:
    name: Xác định phần code thay đổi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lọc theo đường dẫn
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/types/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
            desktop:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  guard:
    name: Chặn lọt tài liệu nội bộ & bí mật
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Không cho docs/, .env và file quy tắc nội bộ nằm trong Git
        run: |
          bad=$(git ls-files | grep -E '^docs/|(^|/)\.env($|\.)|^(AGENTS|CLAUDE|GEMINI)\.md$|^\.agents/|^\.antigravity/|^scratchpad/' | grep -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Phát hiện file nội bộ hoặc file môi trường bị commit:"
            echo "$bad"
            exit 1
          fi
          echo "✅ Không có docs/, .env hay file quy tắc nội bộ trong Git."

      - name: Quét chuỗi giống khóa bí mật
        run: |
          pattern='AIza[0-9A-Za-z_-]{35}|GOCSPX-[0-9A-Za-z_-]{20,}|gh[pousr]_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|nvapi-[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|hosting\.tranquyet\.id\.vn/api/deploy/[A-Za-z0-9_-]{10,}'
          if git grep -nIE "$pattern" -- . ':!pnpm-lock.yaml'; then
            echo "::error::Phát hiện chuỗi giống khóa bí mật ở các dòng trên. Gỡ ra và đổi khóa ngay."
            exit 1
          fi
          echo "✅ Không phát hiện khóa bí mật."

  lint-and-typecheck:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @forgestore/backend run prisma:generate

      - name: Check code formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Build backend
        run: pnpm build:backend

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify migrations do not drop HNSW index
        run: |
          if grep -rni "DROP INDEX.*idx_phan_tich_ai_vector" apps/backend/prisma/migrations/; then
            echo "❌ Error: Migration contains DROP INDEX idx_phan_tich_ai_vector!"
            exit 1
          else
            echo "✅ Verified: No migration drops idx_phan_tich_ai_vector."
          fi

  e2e:
    name: Test e2e backend (Postgres + Redis thật)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forgestore_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forgestore_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/forgestore_e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: e2e-access-secret-chi-dung-cho-test-tren-ci-32
      GITHUB_CLIENT_ID: e2e
      GITHUB_CLIENT_SECRET: e2e
      GITHUB_TOKEN: e2e
      GEMINI_API_KEY: e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Giống DB production: extension vector nằm trong schema "extensions" và có trong search_path
      - name: Chuẩn bị DB e2e
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d forgestore_e2e -v ON_ERROR_STOP=1             -c 'CREATE SCHEMA IF NOT EXISTS extensions'             -c 'CREATE EXTENSION IF NOT EXISTS vector SCHEMA extensions'             -c 'ALTER DATABASE forgestore_e2e SET search_path TO public, extensions'
          pnpm --filter @forgestore/backend exec prisma migrate deploy

      - name: Chạy test e2e
        run: pnpm --filter @forgestore/backend test:e2e

  docker:
    name: Build thử Docker image backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: forgestore-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop (Vite build + Rust check & test)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (desktop)
        run: pnpm install --frozen-lockfile --filter "@forgestore/desktop..."

      - name: Build shared packages (types, ui-tokens)
        run: pnpm build

      # tauri::generate_context! cần thư mục apps/desktop/dist có sẵn lúc biên dịch Rust
      - name: Build desktop frontend
        run: pnpm build:desktop

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  # CD: chỉ khi mọi job xanh trên main mới đẩy commit sang nhánh `production`.
  # Job docker/desktop được bỏ qua (skipped) vì không đụng phần đó thì vẫn tính là đạt; failure/cancelled thì không deploy.
  # Dokploy theo dõi nhánh `production` (Auto Deploy) nên deploy luôn đi sau CI.
  # Rollback: git push origin <sha-cũ>:production --force
  deploy:
    name: Đẩy sang nhánh production (Dokploy tự deploy)
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.guard.result == 'success' &&
      needs.lint-and-typecheck.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    needs: [changes, guard, lint-and-typecheck, e2e, docker, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cập nhật nhánh production
        run: |
          git push origin "${GITHUB_SHA}:refs/heads/production"
          echo "✅ production -> ${GITHUB_SHA}"
